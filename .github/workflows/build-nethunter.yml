name: Build NetHunter Kernel (cheetah/pantah GKI 6.1)

# v1 goal: a bootable GKI 6.1.162 kernel for Pixel 7 Pro (cheetah) with the
# NetHunter *config* layer only (external USB Bluetooth -> hci0, in-tree
# USB-WiFi adapter drivers for monitor mode, HID gadget). NO KernelSU (keeps
# your Magisk). WiFi packet INJECTION (mac80211 source patch) comes in v2,
# after this one boots clean.

on:
  workflow_dispatch:
    inputs:
      use_ccache:
        description: "Enable Ccache"
        type: boolean
        default: true

permissions:
  contents: write

env:
  TZ: UTC
  KERNEL_NAME: "android14-11-nethunter"
  # Official Google Pantah (Pixel 7/Pro) GKI 6.1 source snapshot (same as the base repo)
  PANTAH_SOURCE_URL: "https://github.com/yapixel/gki-build-assets/releases/download/pantah-15260412/kernel-pantah-15260412.tar.xz"
  ANYKERNEL_REPO: "https://github.com/osm0sis/AnyKernel3.git"
  CLANG_VERSION: "17.0.6"
  ARM_TOOLCHAIN_VERSION: "14.2.rel1"

jobs:
  build:
    name: Build NetHunter GKI
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Set up build environment
        run: |
          sudo apt update
          sudo apt install -y --no-install-recommends \
            ccache zstd aria2 libssl-dev libelf-dev libxml2 bc bison flex make \
            gcc g++ pahole zip unzip tar xz-utils curl wget
          mkdir -p output_artifacts

      - name: Download kernel source
        run: |
          mkdir -p common
          echo "Downloading Pantah GKI 6.1 source..."
          aria2c -s16 -x16 -k1M "${{ env.PANTAH_SOURCE_URL }}" -o pantah.tar.xz
          mkdir -p temp_pantah
          tar -xf pantah.tar.xz -C temp_pantah
          rm -f pantah.tar.xz
          if   [ -d "temp_pantah/kernel-pantah-15260412/common/ack" ]; then cp -a temp_pantah/kernel-pantah-15260412/common/ack/. common/
          elif [ -d "temp_pantah/kernel-pantah-15260412/common/gki" ]; then cp -a temp_pantah/kernel-pantah-15260412/common/gki/. common/
          elif [ -d "temp_pantah/common/ack" ]; then cp -a temp_pantah/common/ack/. common/
          elif [ -f "temp_pantah/Makefile" ]; then cp -a temp_pantah/. common/
          fi
          rm -rf temp_pantah
          # allow modifications / stop dirty+ABI gripes
          rm -f common/android/abi_gki_protected_exports_* || true
          sed -i 's/ -dirty//g;s/-dirty//g' common/scripts/setlocalversion 2>/dev/null || true
          sed -i 's/check_defconfig//' common/build.config.gki 2>/dev/null || true
          if [ ! -f common/Makefile ] || [ ! -f common/arch/arm64/configs/gki_defconfig ]; then
            echo "ERROR: kernel source tree invalid"; ls -la common; exit 1
          fi
          echo "Source OK:"; head -n 4 common/Makefile

      - name: Download toolchains
        run: |
          mkdir -p toolchains
          CLANG_DIR="${{ github.workspace }}/toolchains/clang-${{ env.CLANG_VERSION }}"
          mkdir -p "$CLANG_DIR"
          aria2c -s16 -x16 -k1M "https://github.com/llvm/llvm-project/releases/download/llvmorg-${{ env.CLANG_VERSION }}/clang+llvm-${{ env.CLANG_VERSION }}-x86_64-linux-gnu-ubuntu-22.04.tar.xz" -o clang.tar.xz
          tar -xJf clang.tar.xz -C "$CLANG_DIR" --strip-components=1
          rm -f clang.tar.xz
          GCC64_DIR="${{ github.workspace }}/toolchains/gcc64"
          mkdir -p "$GCC64_DIR"
          aria2c -s16 -x16 -k1M "https://developer.arm.com/-/media/Files/downloads/gnu/${{ env.ARM_TOOLCHAIN_VERSION }}/binrel/arm-gnu-toolchain-${{ env.ARM_TOOLCHAIN_VERSION }}-x86_64-aarch64-none-linux-gnu.tar.xz" -o gcc64.tar.xz
          tar -xf gcc64.tar.xz -C "$GCC64_DIR" --strip-components=1
          rm -f gcc64.tar.xz
          echo "CLANG_PATH=$CLANG_DIR/bin" >> "$GITHUB_ENV"
          echo "TOOLCHAIN_PATH=$GCC64_DIR/bin/aarch64-none-linux-gnu-" >> "$GITHUB_ENV"

      - name: Generate base defconfig
        run: |
          cd common
          export PATH="${CLANG_PATH}:${PATH}"
          make -j"$(nproc)" LLVM=1 LLVM_IAS=1 ARCH=arm64 O=out CROSS_COMPILE="${{ env.TOOLCHAIN_PATH }}" gki_defconfig
          test -f out/.config

      - name: Inject NetHunter config layer
        run: |
          cat >> common/out/.config <<-'EOF'
          # ================= NetHunter config layer (v1) =================
          # ---- External USB Bluetooth -> hci0 (fixes CONFIG_BT_HCIBTUSB not set) ----
          CONFIG_BT=y
          CONFIG_BT_HCIBTUSB=y
          CONFIG_BT_HCIBTUSB_BCM=y
          CONFIG_BT_HCIBTUSB_RTL=y
          CONFIG_BT_HCIBTUSB_MTK=y
          # ---- USB Wi-Fi adapters (in-tree, monitor-capable) ----
          CONFIG_WLAN=y
          CONFIG_CFG80211=y
          CONFIG_CFG80211_WEXT=y
          CONFIG_MAC80211=y
          CONFIG_WLAN_VENDOR_ATH=y
          CONFIG_ATH_COMMON=y
          CONFIG_ATH9K_HTC=y
          CONFIG_CARL9170=y
          CONFIG_WLAN_VENDOR_MEDIATEK=y
          CONFIG_MT7601U=y
          CONFIG_MT76x0U=y
          CONFIG_MT76x2U=y
          CONFIG_WLAN_VENDOR_RALINK=y
          CONFIG_RT2800USB=y
          CONFIG_RT2800USB_RT35XX=y
          CONFIG_RT2800USB_RT3573=y
          CONFIG_RT2800USB_RT53XX=y
          CONFIG_RT2800USB_RT55XX=y
          CONFIG_RT2800USB_UNKNOWN=y
          CONFIG_WLAN_VENDOR_REALTEK=y
          CONFIG_RTL8187=y
          CONFIG_RTL8XXXU=y
          CONFIG_RTL8XXXU_UNTESTED=y
          # ---- USB gadget / HID (BadUSB) ----
          CONFIG_USB_CONFIGFS=y
          CONFIG_USB_CONFIGFS_F_HID=y
          CONFIG_USB_CONFIGFS_F_FS=y
          CONFIG_USB_CONFIGFS_ACM=y
          CONFIG_USB_CONFIGFS_SERIAL=y
          CONFIG_USB_CONFIGFS_NCM=y
          CONFIG_USB_CONFIGFS_RNDIS=y
          CONFIG_USB_CONFIGFS_MASS_STORAGE=y
          # ==============================================================
          EOF

      - name: Finalize defconfig (olddefconfig drops any unmet options)
        run: |
          cd common
          export PATH="${CLANG_PATH}:${PATH}"
          make -j"$(nproc)" LLVM=1 LLVM_IAS=1 ARCH=arm64 O=out CROSS_COMPILE="${{ env.TOOLCHAIN_PATH }}" olddefconfig
          echo "===== Did our key flags survive? ====="
          grep -E "CONFIG_BT_HCIBTUSB=|CONFIG_ATH9K_HTC=|CONFIG_MT76x2U=|CONFIG_RTL8XXXU=|CONFIG_USB_CONFIGFS_F_HID=" out/.config || true

      - name: Build Image
        run: |
          cd common
          export PATH="${CLANG_PATH}:${PATH}"
          export KCFLAGS="-O2 -Wno-error"
          make -j"$(nproc)" LLVM=1 LLVM_IAS=1 ARCH=arm64 O=out CROSS_COMPILE="${{ env.TOOLCHAIN_PATH }}" Image
          test -f out/arch/arm64/boot/Image && echo "Image built OK"

      - name: Package AnyKernel3
        run: |
          git clone --depth=1 "${{ env.ANYKERNEL_REPO }}" AK3
          rm -rf AK3/.git
          # Skip device-name check (works on cheetah), flash to boot, keep ramdisk
          sed -i 's/do.devicecheck=1/do.devicecheck=0/' AK3/anykernel.sh || true
          sed -i 's/^kernel.string=.*/kernel.string=NetHunter GKI 6.1 cheetah (v1)/' AK3/anykernel.sh || true
          cp common/out/arch/arm64/boot/Image AK3/Image
          ZIP="NetHunter-cheetah-gki6.1-v1-$(date +%y%m%d).zip"
          ( cd AK3 && zip -r9 "../output_artifacts/$ZIP" . -x "*.git*" )
          echo "Packaged: $ZIP"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: nethunter-kernel-v1
          path: output_artifacts/*
          retention-days: 14

name: Build NetHunter Kernel (cheetah/pantah GKI 6.1)

# v1 goal: a bootable GKI 6.1.162 kernel for Pixel 7 Pro (cheetah) with the
# NetHunter *config* layer only (external USB Bluetooth -> hci0, in-tree
# USB-WiFi adapter drivers for monitor mode, HID gadget). NO KernelSU (keeps
# your Magisk). WiFi packet INJECTION (mac80211 source patch) comes in v2,
# after this one boots clean.

on:
  workflow_dispatch:
    inputs:
      use_ccache:
        description: "Enable Ccache"
        type: boolean
        default: true

permissions:
  contents: write

env:
  TZ: UTC
  KERNEL_NAME: "android14-11-nethunter"
  # Official Google Pantah (Pixel 7/Pro) GKI 6.1 source snapshot (same as the base repo)
  PANTAH_SOURCE_URL: "https://github.com/yapixel/gki-build-assets/releases/download/pantah-15260412/kernel-pantah-15260412.tar.xz"
  ANYKERNEL_REPO: "https://github.com/osm0sis/AnyKernel3.git"
  CLANG_VERSION: "17.0.6"
  ARM_TOOLCHAIN_VERSION: "14.2.rel1"

jobs:
  build:
    name: Build NetHunter GKI
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Set up build environment
        run: |
          echo "=================================================="
          echo "   NETHUNTER WORKFLOW v1.3  (runner: $(lsb_release -ds 2>/dev/null))"
          echo "=================================================="
          sudo apt update
          sudo apt install -y --no-install-recommends \
            ccache zstd aria2 libssl-dev libelf-dev libxml2 libxml2-dev bc bison flex make \
            gcc g++ pahole zip unzip tar xz-utils curl wget
          echo "--- libxml2 present? ---"
          ls -la /usr/lib/x86_64-linux-gnu/libxml2.so* 2>/dev/null || echo "!! libxml2.so.2 MISSING"
          mkdir -p output_artifacts

      - name: Download kernel source (OFFICIAL Google ACK)
        run: |
          echo "Cloning official Google kernel/common @ android14-6.1-2026-03_r25 (kernel 6.1.162)..."
          git clone --depth=1 -b android14-6.1-2026-03_r25 \
            https://android.googlesource.com/kernel/common common
          echo "=== kernel version straight from Google source ==="
          head -n 4 common/Makefile
          # allow our config modifications / stop dirty+ABI gripes
          rm -f common/android/abi_gki_protected_exports_* || true
          sed -i 's/ -dirty//g;s/-dirty//g' common/scripts/setlocalversion 2>/dev/null || true
          sed -i 's/check_defconfig//' common/build.config.gki 2>/dev/null || true
          if [ ! -f common/Makefile ] || [ ! -f common/arch/arm64/configs/gki_defconfig ]; then
            echo "ERROR: kernel source tree invalid"; ls -la common; exit 1
          fi
          echo "Official Google source ready."

      - name: Download toolchains
        run: |
          mkdir -p toolchains
          CLANG_DIR="${{ github.workspace }}/toolchains/clang-${{ env.CLANG_VERSION }}"
          mkdir -p "$CLANG_DIR"
          aria2c -s16 -x16 -k1M "https://github.com/llvm/llvm-project/releases/download/llvmorg-${{ env.CLANG_VERSION }}/clang+llvm-${{ env.CLANG_VERSION }}-x86_64-linux-gnu-ubuntu-22.04.tar.xz" -o clang.tar.xz
          tar -xJf clang.tar.xz -C "$CLANG_DIR" --strip-components=1
          rm -f clang.tar.xz
          GCC64_DIR="${{ github.workspace }}/toolchains/gcc64"
          mkdir -p "$GCC64_DIR"
          aria2c -s16 -x16 -k1M "https://developer.arm.com/-/media/Files/downloads/gnu/${{ env.ARM_TOOLCHAIN_VERSION }}/binrel/arm-gnu-toolchain-${{ env.ARM_TOOLCHAIN_VERSION }}-x86_64-aarch64-none-linux-gnu.tar.xz" -o gcc64.tar.xz
          tar -xf gcc64.tar.xz -C "$GCC64_DIR" --strip-components=1
          rm -f gcc64.tar.xz
          echo "CLANG_PATH=$CLANG_DIR/bin" >> "$GITHUB_ENV"
          echo "TOOLCHAIN_PATH=$GCC64_DIR/bin/aarch64-none-linux-gnu-" >> "$GITHUB_ENV"

      - name: Generate base defconfig
        run: |
          cd common
          export PATH="${CLANG_PATH}:${PATH}"
          echo "--- does ld.lld find libxml2? ---"
          ldd "${CLANG_PATH}/ld.lld" 2>&1 | grep -i xml || echo "(no xml dep reported)"
          make -j"$(nproc)" LLVM=1 LLVM_IAS=1 ARCH=arm64 O=out CROSS_COMPILE="${{ env.TOOLCHAIN_PATH }}" gki_defconfig
          test -f out/.config

      - name: Inject NetHunter config layer (force BUILT-IN =y)
        run: |
          cd common
          # scripts/config -e sets each symbol to =y (built into the Image), which is
          # indentation-proof (unlike a heredoc) and forces built-in even where the
          # GKI defconfig had them as modules.
          ./scripts/config --file out/.config \
            -e CONFIG_BT -e CONFIG_BT_HCIBTUSB -e CONFIG_BT_HCIBTUSB_BCM \
            -e CONFIG_BT_HCIBTUSB_RTL -e CONFIG_BT_HCIBTUSB_MTK \
            -e CONFIG_WLAN -e CONFIG_CFG80211 -e CONFIG_CFG80211_WEXT -e CONFIG_MAC80211 \
            -e CONFIG_WLAN_VENDOR_ATH -e CONFIG_ATH_COMMON -e CONFIG_ATH9K_HTC -e CONFIG_CARL9170 \
            -e CONFIG_WLAN_VENDOR_MEDIATEK -e CONFIG_MT7601U -e CONFIG_MT76x0U -e CONFIG_MT76x2U \
            -e CONFIG_WLAN_VENDOR_RALINK -e CONFIG_RT2800USB -e CONFIG_RT2800USB_RT35XX \
            -e CONFIG_RT2800USB_RT3573 -e CONFIG_RT2800USB_RT53XX -e CONFIG_RT2800USB_RT55XX \
            -e CONFIG_RT2800USB_UNKNOWN \
            -e CONFIG_WLAN_VENDOR_REALTEK -e CONFIG_RTL8187 -e CONFIG_RTL8XXXU -e CONFIG_RTL8XXXU_UNTESTED \
            -e CONFIG_USB_CONFIGFS -e CONFIG_USB_CONFIGFS_F_HID -e CONFIG_USB_CONFIGFS_F_FS \
            -e CONFIG_USB_CONFIGFS_ACM -e CONFIG_USB_CONFIGFS_SERIAL -e CONFIG_USB_CONFIGFS_NCM \
            -e CONFIG_USB_CONFIGFS_RNDIS -e CONFIG_USB_CONFIGFS_MASS_STORAGE
          echo "scripts/config applied."

      - name: Finalize defconfig (olddefconfig drops any unmet options)
        run: |
          cd common
          export PATH="${CLANG_PATH}:${PATH}"
          make -j"$(nproc)" LLVM=1 LLVM_IAS=1 ARCH=arm64 O=out CROSS_COMPILE="${{ env.TOOLCHAIN_PATH }}" olddefconfig
          echo "===== Key flags (want =y, NOT =m) ====="
          grep -E "^CONFIG_BT=|^CONFIG_BT_HCIBTUSB=|^CONFIG_CFG80211=|^CONFIG_MAC80211=|^CONFIG_ATH9K_HTC=|^CONFIG_MT76x2U=|^CONFIG_RTL8XXXU=|^CONFIG_USB_CONFIGFS_F_HID=" out/.config || true
          echo "===== any that fell back to =m? ====="
          grep -E "^CONFIG_(BT|BT_HCIBTUSB|CFG80211|MAC80211|ATH9K_HTC|MT76x2U|RTL8XXXU)=m" out/.config && echo "!! WARNING: above are modules, not built-in" || echo "good - none of the key ones are =m"

      - name: Build Image
        run: |
          cd common
          export PATH="${CLANG_PATH}:${PATH}"
          export KCFLAGS="-O2 -Wno-error"
          make -j"$(nproc)" LLVM=1 LLVM_IAS=1 ARCH=arm64 O=out CROSS_COMPILE="${{ env.TOOLCHAIN_PATH }}" Image
          test -f out/arch/arm64/boot/Image && echo "Image built OK"

      - name: Package AnyKernel3
        run: |
          git clone --depth=1 "${{ env.ANYKERNEL_REPO }}" AK3
          rm -rf AK3/.git
          # ---- Configure AnyKernel for cheetah (Tensor, A/B slots) ----
          sed -i 's/do.devicecheck=1/do.devicecheck=0/' AK3/anykernel.sh || true
          sed -i 's/^kernel.string=.*/kernel.string=NetHunter GKI 6.1 cheetah (v1.1)/' AK3/anykernel.sh || true
          # point at the boot partition BY NAME (auto-resolves) instead of the Galaxy-Nexus OMAP path
          sed -i 's|^BLOCK=.*|BLOCK=boot;|' AK3/anykernel.sh
          # cheetah is an A/B slot device
          sed -i 's|^IS_SLOT_DEVICE=.*|IS_SLOT_DEVICE=1;|' AK3/anykernel.sh
          echo "--- AK3 flash target config ---"
          grep -E "^BLOCK=|^IS_SLOT_DEVICE=|^PATCH_VBMETA_FLAG=|do.devicecheck=" AK3/anykernel.sh
          cp common/out/arch/arm64/boot/Image AK3/Image
          ZIP="NetHunter-cheetah-gki6.1-v1.1-$(date +%y%m%d).zip"
          ( cd AK3 && zip -r9 "../output_artifacts/$ZIP" . -x "*.git*" )
          echo "Packaged: $ZIP"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: nethunter-kernel-v1
          path: output_artifacts/*
          retention-days: 14
